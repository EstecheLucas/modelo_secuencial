<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TensorFlow.js Example</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
</head>
<body>
  <h1>TensorFlow.js Example</h1>
  <p>Formula: y = 2x + 6</p>

  <button onclick="entrenarModelo()">Entrenar Modelo</button>
  <input type="number" id="inputX" placeholder="Valor de X">
  <button onclick="predecir()">Predecir</button>

  <p id="mensajeEntrenamiento"></p>
  <p id="resultado"></p>

  <script>
    let modelo;

    async function entrenarModelo() {
      document.getElementById("mensajeEntrenamiento").innerText = "Entrenando modelo...";

      // Crear modelo secuencial
      modelo = tf.sequential();
      modelo.add(tf.layers.dense({ units: 1, inputShape: [1] }));

      modelo.compile({
        optimizer: "sgd",
        loss: "meanSquaredError"
      });

      // Datos de entrenamiento (x: de -6 a 2, y = 2x + 6)
      const xs = tf.tensor2d([-6, -5, -4, -3, -2, -1, 0, 1, 2], [9, 1]);
      const ys = tf.tensor2d([-6*2+6, -5*2+6, -4*2+6, -3*2+6, -2*2+6, -1*2+6, 0*2+6, 1*2+6, 2*2+6], [9, 1]);

      // Entrenar el modelo con 350 épocas
      await modelo.fit(xs, ys, {
        epochs: 350,
        callbacks: {
          onEpochEnd: (epoch, logs) => {
            console.log(`Época ${epoch}: pérdida = ${logs.loss}`);
          }
        }
      });

      document.getElementById("mensajeEntrenamiento").innerText = "Entrenamiento finalizado. El modelo ya está listo.";
    }

    async function predecir() {
      if (!modelo) {
        alert("Primero debe entrenar el modelo.");
        return;
      }

      const x = parseFloat(document.getElementById("inputX").value);
      if (isNaN(x)) {
        alert("Por favor ingrese un número válido para X.");
        return;
      }

      const inputTensor = tf.tensor2d([x], [1, 1]);
      const outputTensor = modelo.predict(inputTensor);
      const output = await outputTensor.data();

      document.getElementById("resultado").innerText = `El resultado de predecir para ${x} es: ${output[0]}`;
    }
  </script>
</body>
</html>
